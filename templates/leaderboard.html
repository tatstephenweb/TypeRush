{% extends "base.html" %}
{% block title %}Leaderboard - TypeRush{% endblock %}
{% block content %}
<div class="flex items-end justify-between">
  <h1 class="font-display text-4xl font-extrabold text-white">Leaderboard</h1>
  <button id="refresh" class="rounded-lg border border-edge px-4 py-1.5 text-sm text-mute hover:text-white">Refresh</button>
</div>
<div id="me" class="card mt-6 flex items-center justify-between"></div>
<div id="list" class="mt-4 divide-y divide-edge overflow-hidden rounded-xl border border-edge bg-panel/50"></div>
{% endblock %}
{% block scripts %}
<script>
const list = document.getElementById("list"), me = document.getElementById("me");

function rowHTML(p) {
  const medal = { 1: "🥇", 2: "🥈", 3: "🥉" }[p.rank] || p.rank;
  return `<div class="flex items-center gap-3 px-4 py-3 ${p.is_me ? "bg-amber/10" : ""}">
    <div class="w-8 text-center font-mono font-semibold text-mute">${medal}</div>
    ${avatarHTML(p.avatar, p.username)}
    <div class="min-w-0 flex-1">
      <p class="truncate font-semibold text-white">${esc(p.username)}${p.is_me ? ' <span class="text-sm font-normal text-amber">(you)</span>' : ""}</p>
      <p class="text-sm text-mute">${p.games} games, best ${p.best_wpm} WPM</p>
    </div>
    <p class="font-display text-2xl font-bold text-amber">${p.points}</p></div>`;
}

async function load() {
  const { ok, data } = await api("/api/leaderboard");
  if (!ok) { list.innerHTML = `<p class="p-6 text-center text-coral">Could not load the leaderboard. Try refreshing.</p>`; return; }
  me.innerHTML = data.me.rank
    ? `<div><p class="text-sm text-mute">Your rank</p><p class="font-display text-4xl font-bold text-white">#${data.me.rank}</p></div>
       <div class="text-right"><p class="text-sm text-mute">Your points</p><p class="font-display text-4xl font-bold text-amber">${data.me.points}</p></div>`
    : `<p class="text-mute">You are not ranked yet. <a href="/game" class="font-semibold text-amber hover:underline">Play a game</a> to get on the board.</p>`;
  list.innerHTML = data.players.length
    ? data.players.map(rowHTML).join("")
    : `<p class="p-6 text-center text-mute">No scores yet. Be the first to play.</p>`;
}
document.getElementById("refresh").onclick = load;
load();
setInterval(load, 30000);
</script>
{% endblock %}
