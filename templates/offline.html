<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0C1B24">
  <title>Offline - TypeRush</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
           background: #0C1B24; color: #E2E8F0; font-family: system-ui, sans-serif; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 2rem; color: #fff; }
    p { margin: 0 0 24px; color: #8FA9B3; max-width: 26rem; line-height: 1.5; }
    button { border: 0; border-radius: 8px; padding: 12px 28px; font-size: 1rem; font-weight: 600; background: #FFB547; color: #0C1B24; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <h1>You are offline</h1>
    <p>TypeRush needs a connection to save your scores and show the leaderboard. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
